<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 246" width="860" height="246" role="img" aria-label="./streak --stats">
<style>
  .card-bg { fill: #f2f3f8; stroke: #9aa5ce; }
  .title-fg { fill: #8990b3; }
  .fg { fill: #343b58; }
  .muted { fill: #8990b3; }
  .accent { fill: #2e5bcd; }
  .accent2 { fill: #7847bd; }
  .ring-bg{stroke:#8990b3;}.ring{stroke:#2e5bcd;}@keyframes ringdraw{from{stroke-dashoffset:326.7}to{stroke-dashoffset:233.4}}.ring{animation:ringdraw 1.4s ease-out forwards;}
  @media (prefers-color-scheme: dark) {
    .card-bg { fill: #24283b; stroke: #3d59a1; }
    .title-fg { fill: #565f89; }
    .fg { fill: #c0caf5; }
    .muted { fill: #565f89; }
    .accent { fill: #7aa2f7; }
    .accent2 { fill: #bb9af7; }
    .ring-bg{stroke:#565f89;}.ring{stroke:#7aa2f7;filter:drop-shadow(0 0 4px #7aa2f7);}@keyframes ringdraw{from{stroke-dashoffset:326.7}to{stroke-dashoffset:233.4}}.ring{animation:ringdraw 1.4s ease-out forwards;}
  }
</style>

