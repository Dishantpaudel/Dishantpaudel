name: update-profile-art

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # never trigger on the files this workflow itself commits
    paths:
      - "scripts/**"
      - "templates/**"
      - "requirements.txt"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        working-directory: scripts
        run: python fetch_contributions.py

      - name: Render art
        working-directory: scripts
        run: |
          python prep_photo.py
          python make_ascii_svg.py
          python make_wordmark_svg.py
          python render_heatmap_svg.py
          python generate_streak_svg.py
          python render_weekday_svg.py
          python build_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile art"
          git push
